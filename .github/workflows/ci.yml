name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also started by update-claude-code.yml; always runs the smoke test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.13.3
      - run: ruff check . && ruff format --check .
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Install the pinned Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s -- "$(python scripts/claude_code_version.py current)"
      - name: Validate plugin
        run: ~/.local/bin/claude plugin validate --strict .

  cache-save:
    # Saves a cache as docs/configuration.md#caches tells a repository's own CI to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/nexkit-cache-test
          key: nexkit-${{ runner.os }}-demo-${{ hashFiles('pyproject.toml', 'nexkit/__init__.py') }}
          restore-keys: nexkit-${{ runner.os }}-demo-
      - run: mkdir -p ~/nexkit-cache-test && touch ~/nexkit-cache-test/marker

  cache-restore:
    # The agent and verify jobs' restore action finds that cache and skips a missing one.
    needs: cache-save
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      - id: restore
        uses: ./kit/.github/actions/restore-caches
        with:
          python: ${{ steps.python.outputs.python-path }}
          repo: repo
          config: >-
            {"cache": [
              {"name": "demo", "paths": ["~/nexkit-cache-test"],
               "key_files": ["pyproject.toml", "nexkit/__init__.py"]},
              {"name": "missing", "paths": ["~/nexkit-cache-missing"],
               "key_files": ["pyproject.toml"]}]}
      - run: test -f ~/nexkit-cache-test/marker && test ! -e ~/nexkit-cache-missing

  decide-smoke-test:
    # A pull request runs the smoke test only when it changes what the test covers, and only
    # from a branch of this repository: pull requests from forks do not receive secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        # HEAD is the test merge commit; its first parent is the base branch.
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(nexkit/agent\.py|nexkit/runtimes/|nexkit/__init__\.py|nexkit/prompts/|scripts/smoke\.py)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  smoke-test:
    # Real Claude Code against a tiny repository. Needs the CLAUDE_CODE_OAUTH_TOKEN secret.
    # Runs when started by hand or by update-claude-code.yml, and on pull requests that
    # change the agent, its runtimes, its prompts, the Claude Code pin or the smoke test.
    needs: decide-smoke-test
    if: >-
      !cancelled() &&
      (github.event_name == 'workflow_dispatch' || needs.decide-smoke-test.outputs.run == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s -- "$(python scripts/claude_code_version.py current)"
      - name: Smoke test
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN secret to run the live smoke test."
            exit 1
          fi
          python scripts/smoke.py --claude ~/.local/bin/claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
