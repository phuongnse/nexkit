name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also started by update-claude-code.yml; runs the live smoke test

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.13.3
      - run: ruff check . && ruff format --check .
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Install the pinned Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s -- "$(python scripts/claude_code_version.py current)"
      - name: Validate plugin
        run: ~/.local/bin/claude plugin validate --strict .

  live:
    # Real Claude Code against a tiny repository. Needs the CLAUDE_CODE_OAUTH_TOKEN secret.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s -- "$(python scripts/claude_code_version.py current)"
      - name: Smoke test
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN secret to run the live smoke test."
            exit 1
          fi
          python scripts/smoke.py --claude ~/.local/bin/claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
