name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # also started by update-agents.yml; runs the smoke test of `runtime`
    inputs:
      runtime:
        description: Runtime to smoke-test
        type: choice
        options: [all, claude-code]
        default: all

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.13.3
      - run: ruff check . && ruff format --check .
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Install the pinned Claude Code
        run: python bin/nexkit install-agents --runtime claude-code
      - name: Validate plugin
        run: claude plugin validate --strict .

  cache-save:
    # Saves a cache as docs/configuration.md#caches tells a repository's own CI to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/nexkit-cache-test
          key: nexkit-${{ runner.os }}-demo-${{ hashFiles('pyproject.toml', 'nexkit/__init__.py') }}
          restore-keys: nexkit-${{ runner.os }}-demo-
      - run: mkdir -p ~/nexkit-cache-test && touch ~/nexkit-cache-test/marker

  cache-restore:
    # The agent and verify jobs' restore action finds that cache and skips a missing one.
    needs: cache-save
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      - id: restore
        uses: ./kit/.github/actions/restore-caches
        with:
          python: ${{ steps.python.outputs.python-path }}
          repo: repo
          config: >-
            {"agents": {"claude": {"runtime": "claude-code", "provider": "anthropic",
                                   "oauth_token_secret": "CLAUDE_CODE_OAUTH_TOKEN"}},
             "cache": [
              {"name": "demo", "paths": ["~/nexkit-cache-test"],
               "key_files": ["pyproject.toml", "nexkit/__init__.py"]},
              {"name": "missing", "paths": ["~/nexkit-cache-missing"],
               "key_files": ["pyproject.toml"]}]}
      - run: test -f ~/nexkit-cache-test/marker && test ! -e ~/nexkit-cache-missing

  decide-smoke-test:
    # A pull request runs a runtime's smoke test only when it changes what the test covers:
    # the shared agent code or that runtime's module. Only from a branch of this repository:
    # pull requests from forks do not receive secrets.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    outputs:
      claude_code: ${{ steps.diff.outputs.claude_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        # HEAD is the test merge commit; its first parent is the base branch.
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          # A runtime's pin in nexkit/__init__.py counts as that runtime's own change.
          pins=$(git diff HEAD^1 HEAD -- nexkit/__init__.py | grep -oE '^[+-]CLAUDE_CODE =' || true)
          shared='^(nexkit/agent\.py|nexkit/schema\.py|nexkit/runtimes/(__init__|base|providers)\.py|nexkit/prompts/|scripts/smoke\.py)'
          if grep -qE "$shared|^nexkit/runtimes/claude_code\.py" <<< "$changed" || grep -q CLAUDE_CODE <<< "$pins"; then
            echo "claude_code=true" >> "$GITHUB_OUTPUT"
          fi

  smoke-claude-code:
    # Real Claude Code against a tiny repository. Needs the CLAUDE_CODE_OAUTH_TOKEN secret.
    needs: decide-smoke-test
    if: >-
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && contains(fromJSON('["all","claude-code"]'), inputs.runtime)) ||
       needs.decide-smoke-test.outputs.claude_code == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Claude Code
        run: python bin/nexkit install-agents --runtime claude-code
      - name: Smoke test
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN secret to run the live smoke test."
            exit 1
          fi
          python scripts/smoke.py --runtime claude-code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
