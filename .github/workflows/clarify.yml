name: NexKit requirement clarification
on:
  workflow_call:
    inputs:
      pipeline:
        type: string
        required: true
      kit_repository:
        type: string
        required: true
      kit_ref:
        type: string
        required: true
    secrets:
      OPENAI_API_KEY:
        required: false
permissions: {}
env:
  NEXKIT_PROGRESS: '1'
  NEXKIT_PIPELINE: ${{ inputs.pipeline }}
concurrency:
  group: nexkit-work
  queue: max
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      actions: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      base: ${{ steps.prepare.outputs.base }}
      model: ${{ steps.prepare.outputs.model }}
      effort: ${{ steps.prepare.outputs.effort }}
      agent_minutes: ${{ steps.prepare.outputs.agent_minutes }}
      agent_runner: ${{ steps.prepare.outputs.agent_runner }}
      authentication: ${{ steps.prepare.outputs.authentication }}
    steps:
      - name: Validate the kit pin against trusted default-branch configuration
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REPOSITORY: ${{ inputs.kit_repository }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from urllib.parse import quote
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path]))
          repo = os.environ['GITHUB_REPOSITORY']
          branch = api('repos/' + repo)['default_branch']
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          data = api('repos/' + repo + '/contents/.nexkit/project.json?ref=' + quote(branch, safe=''))
          pin = json.loads(base64.b64decode(data['content']))['kit']
          assert re.fullmatch('[0-9a-f]{40}', pin['ref'])
          assert pin['ref'] == os.environ['NEXKIT_REF']
          assert pin['repository'] == os.environ['NEXKIT_REPOSITORY']
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - name: Prepare the toolkit Python runtime
        uses: ./kit/actions/python-runtime
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
          PYTHONPATH: ${{ github.workspace }}/kit
        run: python3 -m nexkit.clarify prepare --kit-ref "$NEXKIT_REF"
      - if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexkit-context-${{ github.run_attempt }}
          path: /tmp/nexkit/context.json
          retention-days: 7
          if-no-files-found: error
  clarify:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.agent_runner) }}
    timeout-minutes: 70
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - name: Prepare the toolkit Python runtime
        uses: ./kit/actions/python-runtime
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nexkit-context-${{ github.run_attempt }}
          path: /tmp/nexkit
      - name: Validate request authority before dependency setup
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
          NEXKIT_CONTEXT: /tmp/nexkit/context.json
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-m', 'nexkit.clarify', 'guard', '--context', os.environ['NEXKIT_CONTEXT']], check=True)
      - uses: ./kit/actions/agent-workspace
        with:
          role: request
          context: /tmp/nexkit/context.json
          source: ${{ github.workspace }}/source
      - name: Recheck approval and cancellation before invoking the agent
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
          NEXKIT_CONTEXT: /tmp/nexkit/context.json
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, '-m', 'nexkit.clarify', 'guard', '--context', os.environ['NEXKIT_CONTEXT']], check=True)
      - id: session
        name: Run the accepted Codex session
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.agent_minutes) }}
        uses: ./kit/actions/agent-session
        with:
          role: request
          context: /tmp/nexkit/context.json
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
      - id: diagnostics
        name: Keep agent diagnostics after success or failure
        continue-on-error: true
        if: always()
        uses: ./kit/actions/agent-diagnostics
        with:
          role: request
          context: /tmp/nexkit/context.json
          outcome: ${{ steps.session.outcome || 'skipped' }}
      - name: Collect data with trusted code (no candidate execution)
        shell: python
        env:
          PYTHONPATH: ${{ github.workspace }}/kit
          NEXKIT_ROLE: request
          NEXKIT_CONTEXT: /tmp/nexkit/context.json
          NEXKIT_RESULT: /tmp/nexkit/requirement.json
        run: |
          import os, subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, '-m', 'nexkit.agent_session', 'collect', '--role', os.environ['NEXKIT_ROLE'], '--source', str(Path(os.environ['GITHUB_WORKSPACE']) / 'source'), '--context', os.environ['NEXKIT_CONTEXT'], '--out', os.environ['NEXKIT_RESULT']], check=True)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexkit-requirement-${{ github.run_attempt }}
          path: /tmp/nexkit/requirement.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [prepare, clarify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - name: Prepare the toolkit Python runtime
        uses: ./kit/actions/python-runtime
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: nexkit-*-${{ github.run_attempt }}
          path: /tmp/nexkit
          merge-multiple: true
      - name: Recheck current requirement before updating its specification
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
        run: python3 -m nexkit.clarify publish
  interrupted:
    needs: [prepare, clarify, publish]
    if: always() && needs.prepare.outputs.ready == 'true' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - name: Prepare the toolkit Python runtime
        uses: ./kit/actions/python-runtime
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: nexkit-context-${{ github.run_attempt }}
          path: /tmp/nexkit
      - name: Persist the interrupted requirement run
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
        run: python3 -m nexkit.clarify failed
