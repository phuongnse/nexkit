name: NexKit requirement clarification
on:
  workflow_call:
    inputs:
      kit_repository:
        type: string
        required: true
      kit_ref:
        type: string
        required: true
    secrets:
      OPENAI_API_KEY:
        required: false
permissions: {}
concurrency:
  group: nexkit-work
  queue: max
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      actions: read
    outputs:
      ready: ${{ steps.prepare.outputs.ready }}
      base: ${{ steps.prepare.outputs.base }}
      model: ${{ steps.prepare.outputs.model }}
      effort: ${{ steps.prepare.outputs.effort }}
      codex_version: ${{ steps.prepare.outputs.codex_version }}
      agent_minutes: ${{ steps.prepare.outputs.agent_minutes }}
      agent_runner: ${{ steps.prepare.outputs.agent_runner }}
      authentication: ${{ steps.prepare.outputs.authentication }}
    steps:
      - name: Validate the kit pin against trusted default-branch configuration
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REPOSITORY: ${{ inputs.kit_repository }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from urllib.parse import quote
          def api(path):
              return json.loads(subprocess.check_output(['gh','api',path]))
          repo = os.environ['GITHUB_REPOSITORY']
          branch = api('repos/' + repo)['default_branch']
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          data = api('repos/' + repo + '/contents/.nexkit/project.json?ref=' + quote(branch, safe=''))
          pin = json.loads(base64.b64decode(data['content']))['kit']
          assert re.fullmatch('[0-9a-f]{40}', pin['ref'])
          assert pin['ref'] == os.environ['NEXKIT_REF']
          assert pin['repository'] == os.environ['NEXKIT_REPOSITORY']
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
          PYTHONPATH: ${{ github.workspace }}/kit
        run: python3 -m nexkit.clarify prepare --kit-ref "$NEXKIT_REF"
      - if: steps.prepare.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexkit-context-${{ github.run_attempt }}
          path: /tmp/nexkit/context.json
          retention-days: 7
          if-no-files-found: error
  clarify:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ${{ fromJSON(needs.prepare.outputs.agent_runner) }}
    timeout-minutes: 70
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nexkit-context-${{ github.run_attempt }}
          path: /tmp/nexkit
      - uses: ./kit/actions/agent-workspace
        with:
          role: request
          context: /tmp/nexkit/context.json
          source: ${{ github.workspace }}/source
      - name: Recheck approval and cancellation before invoking the agent
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
        run: python3 -m nexkit.clarify guard --context /tmp/nexkit/context.json
      - name: Clarify the requirement with the official Codex CLI
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.agent_minutes) }}
        if: needs.prepare.outputs.authentication == 'api-key'
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: ${{ needs.prepare.outputs.codex_version }}
          model: ${{ needs.prepare.outputs.model }}
          effort: ${{ needs.prepare.outputs.effort }}
          prompt-file: /tmp/nexkit/prompt.txt
          output-schema-file: /tmp/nexkit/schema.json
          output-file: /home/nexkit-agent/output/result.json
          working-directory: /home/nexkit-agent/work
          codex-home: /home/nexkit-agent/.codex
          safety-strategy: unprivileged-user
          codex-user: nexkit-agent
          sandbox: read-only
          codex-args: '["--ephemeral"]'
          allow-bots: true
      - name: Run Codex with this runner's ChatGPT session
        if: needs.prepare.outputs.authentication == 'chatgpt'
        timeout-minutes: ${{ fromJSON(needs.prepare.outputs.agent_minutes) }}
        uses: ./kit/actions/codex-subscription
        with:
          role: request
          context: /tmp/nexkit/context.json
      - name: Collect data with trusted code (no candidate execution)
        env:
          PYTHONPATH: ${{ github.workspace }}/kit
        run: |
          sudo pkill -KILL -u nexkit-agent || test "$?" = 1
          python3 -m nexkit.ci collect --role request --source "$GITHUB_WORKSPACE/source" --workspace /home/nexkit-agent/work --context /tmp/nexkit/context.json --result /home/nexkit-agent/output/result.json --out /tmp/nexkit/requirement.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexkit-requirement-${{ github.run_attempt }}
          path: /tmp/nexkit/requirement.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [prepare, clarify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: nexkit-*-${{ github.run_attempt }}
          path: /tmp/nexkit
          merge-multiple: true
      - name: Recheck current requirement before updating its specification
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
        run: python3 -m nexkit.clarify publish
  interrupted:
    needs: [prepare, clarify, publish]
    if: always() && needs.prepare.outputs.ready == 'true' && needs.publish.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: nexkit-context-${{ github.run_attempt }}
          path: /tmp/nexkit
      - name: Persist the interrupted requirement run
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
        run: python3 -m nexkit.clarify failed
