# The agent job: plan, implement or fix, called by pipeline.yml.
#
# A workflow of its own, for its secrets: a job that reads `secrets[...]` with a name known
# only at run time gets every secret on its runner, the App's key too, and an agent can read
# its runner. pipeline.yml does that read in the `secrets:` of the call, which GitHub
# evaluates off the runner, so this job's runner holds only the slots below.
name: NexKit agent

on:
  workflow_call:
    inputs:
      nexkit_repository:
        type: string
        required: true
      nexkit_ref:
        type: string
        required: true
      action:
        type: string
        required: true
      decision:
        type: string
        required: true
      config:
        type: string
        required: true
      timeout:
        type: string
        required: true
      secret_names:
        type: string
        required: true
      agent_ref:
        type: string
        required: true
    secrets:
      AGENT_SECRET_1:
        required: false
      AGENT_SECRET_2:
        required: false
      AGENT_SECRET_3:
        required: false
      AGENT_SECRET_4:
        required: false
      AGENT_SECRET_5:
        required: false
      AGENT_SECRET_6:
        required: false
      AGENT_SECRET_7:
        required: false
      AGENT_SECRET_8:
        required: false

permissions: {}

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(inputs.timeout) }}
    permissions:
      actions: read # the result files of an earlier run's failing checks; CI runs' evidence
      checks: read # the error annotations of the failed jobs of CI runs the issue names
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.agent_ref }}
          path: repo
          # A fix round needs the history of the branch and its base to merge them.
          fetch-depth: ${{ inputs.action == 'fix' && '0' || '1' }}
          persist-credentials: false
      # Restore only, before setup: this job runs code the agent wrote (see the action).
      - name: Restore caches
        if: inputs.action != 'plan' && fromJSON(inputs.config).cache[0]
        continue-on-error: true # a missing or failed cache never fails the run
        uses: ./kit/.github/actions/restore-caches
        with:
          python: ${{ steps.python.outputs.python-path }}
          config: ${{ inputs.config }}
          repo: repo
      # The pinned version of each runtime the configuration uses (nexkit/__init__.py).
      - name: Install agents
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit install-agents
        env:
          NEXKIT_CONFIG: ${{ inputs.config }}
      # A fix round after failing checks that kept result files (checks[].results): the
      # nexkit-checks artifact of the run that recorded them, outside the working tree.
      - name: Download check results
        if: fromJSON(inputs.decision).results_run
        continue-on-error: true # an expired artifact leaves the prompt without the files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexkit-checks
          path: ${{ runner.temp }}/nexkit-checks
          run-id: ${{ fromJSON(inputs.decision).results_run }}
          github-token: ${{ github.token }}
      - name: Collect issue context
        run: >-
          ${{ steps.python.outputs.python-path }} kit/bin/nexkit context --out out
          --results "$RUNNER_TEMP/nexkit-checks" --evidence "$RUNNER_TEMP/nexkit-evidence"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXKIT_DECISION: ${{ inputs.decision }}
          NEXKIT_CONFIG: ${{ inputs.config }}
      - name: Run agent
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit agent --repo repo --out out
        env:
          NEXKIT_DECISION: ${{ inputs.decision }}
          NEXKIT_CONFIG: ${{ inputs.config }}
          # The agent secrets of this job's stages, which pipeline.yml put in these slots
          # (nexkit/runtimes/__init__.py); each CLI gets only its own.
          NEXKIT_AGENT_SECRETS: ${{ inputs.secret_names }}
          NEXKIT_AGENT_SECRET_1: ${{ secrets.AGENT_SECRET_1 }}
          NEXKIT_AGENT_SECRET_2: ${{ secrets.AGENT_SECRET_2 }}
          NEXKIT_AGENT_SECRET_3: ${{ secrets.AGENT_SECRET_3 }}
          NEXKIT_AGENT_SECRET_4: ${{ secrets.AGENT_SECRET_4 }}
          NEXKIT_AGENT_SECRET_5: ${{ secrets.AGENT_SECRET_5 }}
          NEXKIT_AGENT_SECRET_6: ${{ secrets.AGENT_SECRET_6 }}
          NEXKIT_AGENT_SECRET_7: ${{ secrets.AGENT_SECRET_7 }}
          NEXKIT_AGENT_SECRET_8: ${{ secrets.AGENT_SECRET_8 }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nexkit-agent
          path: out/
          if-no-files-found: ignore
          retention-days: 14
