# NexKit's reusable pipeline. Repositories call it from .github/workflows/nexkit.yml.
#
# route    decide the action from the event; read config from the default branch;
#          acknowledge the command and link the run; never runs repo code
# agent    run the stage's agent (plan / implement / fix); no GitHub write token; restores
#          caches before setup but never saves one; a fix round downloads the result files
#          that the last round's failing checks kept
# publish  post the plan, or commit the patch and open the PR; never runs repo code
# verify   run setup and checks on the exact candidate; no secrets at all; restores
#          caches but never saves one
# review   independent read-only agent review of that candidate
# report   statuses, PR review, run and state comments, next automatic round; with
#          merge.auto, the merge and the base branch's merge.after_workflows
# maintain work that follows other events: closing a parent issue, resuming commands
#          paused at the usage limit (waiting for their reset in a run of its own),
#          starting rounds for conflicts with the base branch, autopilot sweeps; no agent
#          and no repository checkout
#
# Supported versions are fixed: ubuntu-24.04, Python 3.12 for NexKit itself, and the
# version of each agent runtime in nexkit/__init__.py.
name: NexKit pipeline

on:
  workflow_call:
    inputs:
      nexkit_repository:
        type: string
        default: phuongnse/nexkit
      nexkit_ref:
        type: string
        required: true
    secrets:
      # For workflows that pass secrets one by one: the names Claude's secrets and the push
      # token had before they were named in the config (DECLARED_SECRETS). Others need
      # `secrets: inherit`.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      NEXKIT_PUSH_TOKEN:
        required: false

permissions: {}

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write # reactions and the status comment on pull requests
      statuses: write # pending statuses while a round runs
    outputs:
      action: ${{ steps.route.outputs.action }}
      decision: ${{ steps.route.outputs.decision }}
      config: ${{ steps.route.outputs.config }}
      head: ${{ steps.route.outputs.head }}
      base: ${{ steps.route.outputs.base }}
      agent_ref: ${{ steps.route.outputs.agent_ref }}
      agent_timeout: ${{ steps.route.outputs.agent_timeout }}
      review_timeout: ${{ steps.route.outputs.review_timeout }}
      checks_timeout: ${{ steps.route.outputs.checks_timeout }}
      agent_secrets: ${{ steps.route.outputs.agent_secrets }}
      review_secrets: ${{ steps.route.outputs.review_secrets }}
      maintain_timeout: ${{ steps.route.outputs.maintain_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
          sparse-checkout: .nexkit
          persist-credentials: false
      - id: route
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit route --repo repo
        env:
          GITHUB_TOKEN: ${{ github.token }}

  agent:
    needs: route
    if: contains(fromJSON('["plan","implement","fix"]'), needs.route.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.route.outputs.agent_timeout) }}
    permissions:
      actions: read # the result files of an earlier run's failing checks
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.agent_ref }}
          path: repo
          # A fix round needs the history of the branch and its base to merge them.
          fetch-depth: ${{ needs.route.outputs.action == 'fix' && '0' || '1' }}
          persist-credentials: false
      # Restore only, before setup: this job runs code the agent wrote (see the action).
      - name: Restore caches
        if: needs.route.outputs.action != 'plan' && fromJSON(needs.route.outputs.config).cache[0]
        continue-on-error: true # a missing or failed cache never fails the run
        uses: ./kit/.github/actions/restore-caches
        with:
          python: ${{ steps.python.outputs.python-path }}
          config: ${{ needs.route.outputs.config }}
          repo: repo
      # The pinned version of each runtime the configuration uses (nexkit/__init__.py).
      - name: Install agents
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit install-agents
        env:
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
      # A fix round after failing checks that kept result files (checks[].results): the
      # nexkit-checks artifact of the run that recorded them, outside the working tree.
      - name: Download check results
        if: fromJSON(needs.route.outputs.decision).results_run
        continue-on-error: true # an expired artifact leaves the prompt without the files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexkit-checks
          path: ${{ runner.temp }}/nexkit-checks
          run-id: ${{ fromJSON(needs.route.outputs.decision).results_run }}
          github-token: ${{ github.token }}
      - name: Collect issue context
        run: >-
          ${{ steps.python.outputs.python-path }} kit/bin/nexkit context --out out
          --results "$RUNNER_TEMP/nexkit-checks"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
      - name: Run agent
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit agent --repo repo --out out
        env:
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          # Only the agent secrets this job's stages need, which route names in agent_secrets,
          # read by name into slots (nexkit/runtimes/__init__.py); each CLI gets only its own.
          NEXKIT_AGENT_SECRETS: ${{ needs.route.outputs.agent_secrets }}
          NEXKIT_AGENT_SECRET_1: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[0]] }}
          NEXKIT_AGENT_SECRET_2: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[1]] }}
          NEXKIT_AGENT_SECRET_3: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[2]] }}
          NEXKIT_AGENT_SECRET_4: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[3]] }}
          NEXKIT_AGENT_SECRET_5: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[4]] }}
          NEXKIT_AGENT_SECRET_6: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[5]] }}
          NEXKIT_AGENT_SECRET_7: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[6]] }}
          NEXKIT_AGENT_SECRET_8: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[7]] }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nexkit-agent
          path: out/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [route, agent]
    if: needs.agent.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      result: ${{ steps.publish.outputs.result }}
      head: ${{ steps.publish.outputs.head }}
      pr: ${{ steps.publish.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.base }}
          path: repo
          fetch-depth: 0
          # The secret that publish.push_token_secret names, or the Actions token without one.
          token: ${{ secrets[fromJSON(needs.route.outputs.config).publish.push_token_secret] || github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexkit-agent
          path: artifacts
      - id: publish
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit publish --repo repo --artifacts artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXKIT_PUSH_TOKEN: ${{ secrets[fromJSON(needs.route.outputs.config).publish.push_token_secret] }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}

  verify:
    needs: [route, publish]
    if: >-
      always() && needs.route.result == 'success' &&
      (needs.route.outputs.action == 'review' ||
       (contains(fromJSON('["implement","fix"]'), needs.route.outputs.action) &&
        needs.publish.outputs.head != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.route.outputs.checks_timeout) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.head || needs.route.outputs.head }}
          path: repo
          # All history, for the merge base in NEXKIT_BASE_SHA and for NEXKIT_VERIFIED_SHA.
          fetch-depth: 0
          persist-credentials: false
      # Restore only, before setup: this job runs code the agent wrote (see the action).
      - name: Restore caches
        if: fromJSON(needs.route.outputs.config).cache[0]
        continue-on-error: true # a missing or failed cache never fails the run
        uses: ./kit/.github/actions/restore-caches
        with:
          python: ${{ steps.python.outputs.python-path }}
          config: ${{ needs.route.outputs.config }}
          repo: repo
      - name: Run setup and checks
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit checks --repo repo --out out
        env:
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nexkit-checks
          path: out/
          retention-days: 14

  review:
    needs: [route, publish, verify]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.route.outputs.review_timeout) }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.head || needs.route.outputs.head }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexkit-checks
          path: checks
      # The pinned version of each runtime the configuration uses (nexkit/__init__.py).
      - name: Install agents
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit install-agents
        env:
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.route.outputs.action == 'fix'
        with:
          name: nexkit-agent
          path: agent
      - name: Collect issue context
        run: >-
          ${{ steps.python.outputs.python-path }} kit/bin/nexkit context --out out --pr "$PR"
          --stage review --fix-result agent/result.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          PR: ${{ needs.publish.outputs.pr }}
      - name: Run agent review
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit agent --stage review --repo repo --out out --checks checks/checks.json
        env:
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          # Only the agent secrets this job's stages need, which route names in review_secrets,
          # read by name into slots (nexkit/runtimes/__init__.py); each CLI gets only its own.
          NEXKIT_AGENT_SECRETS: ${{ needs.route.outputs.review_secrets }}
          NEXKIT_AGENT_SECRET_1: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[0]] }}
          NEXKIT_AGENT_SECRET_2: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[1]] }}
          NEXKIT_AGENT_SECRET_3: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[2]] }}
          NEXKIT_AGENT_SECRET_4: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[3]] }}
          NEXKIT_AGENT_SECRET_5: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[4]] }}
          NEXKIT_AGENT_SECRET_6: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[5]] }}
          NEXKIT_AGENT_SECRET_7: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[6]] }}
          NEXKIT_AGENT_SECRET_8: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[7]] }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nexkit-review
          path: out/
          if-no-files-found: ignore
          retention-days: 14

  report:
    needs: [route, agent, publish, verify, review]
    if: >-
      always() && needs.route.result == 'success' &&
      !contains(fromJSON('["none","maintain"]'), needs.route.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # merge with merge.auto; report never pushes or runs repository code
      issues: write
      pull-requests: write
      statuses: write
      actions: write # next automatic round and merge.after_workflows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.agent.result != 'skipped'
        continue-on-error: true # stage crashed before uploading; report reads files as absent
        with:
          name: nexkit-agent
          path: artifacts/nexkit-agent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verify.result != 'skipped'
        continue-on-error: true # stage crashed before uploading; report reads files as absent
        with:
          name: nexkit-checks
          path: artifacts/nexkit-checks
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.review.result != 'skipped'
        continue-on-error: true # stage crashed before uploading; report reads files as absent
        with:
          name: nexkit-review
          path: artifacts/nexkit-review
      - name: Report
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit report --artifacts artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          NEXKIT_NEEDS: ${{ toJSON(needs) }}
          NEXKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  maintain:
    needs: route
    if: needs.route.outputs.action == 'maintain'
    runs-on: ubuntu-24.04
    # Longer for the run that waits for paused commands to come due (usage_limit.wait_minutes).
    timeout-minutes: ${{ fromJSON(needs.route.outputs.maintain_timeout) }}
    permissions:
      contents: read
      issues: write # close parent issues; mark paused runs as resumed; autopilot's issues
      pull-requests: write # paused runs on pull requests; close a pull request a split supersedes
      actions: write # resume paused commands, start conflict rounds and autopilot's commands
      checks: read # the annotations that name the failures of flaky runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      - name: Maintain
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit maintain
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          NEXKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
