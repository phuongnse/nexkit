# NexKit's reusable pipeline. Repositories call it from .github/workflows/nexkit.yml.
#
# Every write to GitHub is made as the repository's GitHub App (github_app in the config):
# each job that writes mints a token for this repository with only what that job needs, as
# its first use of the App's secrets. A job that runs an agent or repository code never
# holds the App's key or a token of it; github.token only reads. The agent and review jobs
# are workflows of their own (pipeline-agent.yml, pipeline-review.yml) for this: see there.
#
# route    decide the action from the event; read config from the default branch;
#          acknowledge the command and link the run; in an automatic review, skip the
#          checks whose unaffected_by lists every changed path; never runs repo code
# agent    run the stage's agent (plan / implement / fix); no GitHub write token; restores
#          caches before setup but never saves one; a fix round downloads the result files
#          that the last round's failing checks kept
# publish  post the plan, or commit the patch and open the PR; when the base branch's
#          rules want pull requests up to date, merge its tip after the round's commit;
#          never runs repo code
# verify   run setup and checks on the exact candidate; no secrets at all; restores
#          caches but never saves one; with parallel_checks, one job per check job
# combine  with parallel_checks, join the check jobs' results into one nexkit-checks;
#          no secrets, no repository checkout
# review   independent read-only agent review of that candidate; after NexKit brought an
#          approved pull request up to date with a clean merge, the approval carries over
#          when the change is the same, and no agent runs
# report   statuses, PR review, run and state comments, next automatic round; with
#          merge.auto, the merge and the base branch's merge.after_workflows
# maintain work that follows other events: closing a parent issue, resuming commands
#          paused at the usage limit (waiting for their reset in a run of its own),
#          starting rounds for conflicts with the base branch, stopping a round in its
#          checks that a move of the base branch left without a purpose (with
#          force-cancel, so its report and finish do not run), autopilot sweeps, which
#          also end the comments and statuses of runs that ended without a report and
#          merge pull requests whose required checks passed since or that GitHub now
#          accepts, merging a refused pull request after a writer's approval, the sweep after
#          a command NexKit started that route refused, and, instead of a command, the
#          closing of a pull request whose base branch already holds its change, and
#          deleting the branches of closed work; no agent and no repository checkout
# finish   when report did not finish, such as after a lost runner or a cancelled run:
#          start a sweep that waits for this run to end, handles its run comment and
#          starts the conflict round held back while it ran; no agent and no repository
#          checkout
#
# Supported versions are fixed: ubuntu-24.04, Python 3.12 for NexKit itself, and the
# version of each agent runtime in nexkit/__init__.py.
name: NexKit pipeline

on:
  workflow_call:
    inputs:
      nexkit_repository:
        type: string
        default: phuongnse/nexkit
      nexkit_ref:
        type: string
        required: true
    secrets:
      # For workflows that pass secrets one by one: the names Claude's secrets had before
      # they were named in the config (DECLARED_SECRETS), and the names `nexkit init` gives
      # the App's (APP_SECRETS). Others need `secrets: inherit`.
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      NEXKIT_APP_ID:
        required: false
      NEXKIT_APP_PRIVATE_KEY:
        required: false

permissions: {}

jobs:
  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.route.outputs.action }}
      decision: ${{ steps.route.outputs.decision }}
      config: ${{ steps.route.outputs.config }}
      head: ${{ steps.route.outputs.head }}
      base: ${{ steps.route.outputs.base }}
      agent_ref: ${{ steps.route.outputs.agent_ref }}
      agent_timeout: ${{ steps.route.outputs.agent_timeout }}
      review_timeout: ${{ steps.route.outputs.review_timeout }}
      check_matrix: ${{ steps.route.outputs.check_matrix }}
      skip_verify: ${{ steps.route.outputs.skip_verify }}
      parallel_checks: ${{ steps.route.outputs.parallel_checks }}
      count_shards: ${{ steps.route.outputs.count_shards }}
      shards_timeout: ${{ steps.route.outputs.shards_timeout }}
      agent_secrets: ${{ steps.route.outputs.agent_secrets }}
      review_secrets: ${{ steps.route.outputs.review_secrets }}
      maintain_timeout: ${{ steps.route.outputs.maintain_timeout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: repo
          sparse-checkout: .nexkit
          persist-credentials: false
      # Which secrets hold the App's id and key: no earlier job read the configuration.
      - id: app
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit app --repo repo
      # Acknowledge the command, link the run, set pending statuses.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets[steps.app.outputs.app_id_secret] }}
          private-key: ${{ secrets[steps.app.outputs.private_key_secret] }}
          permission-actions: read # whether the implement round of a pull request still runs
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write # reactions and the status comment on pull requests
          permission-statuses: write # pending statuses while a round runs
      - if: failure() && steps.token.outcome == 'failure'
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit app --no-token
      - id: route
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit route --repo repo
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          NEXKIT_APP_SLUG: ${{ steps.token.outputs.app-slug }}

  agent:
    needs: route
    if: contains(fromJSON('["plan","implement","fix"]'), needs.route.outputs.action)
    permissions:
      actions: read # the result files of an earlier run's failing checks; CI runs' evidence
      checks: read # the error annotations of the failed jobs of CI runs the issue names
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/pipeline-agent.yml
    with:
      nexkit_repository: ${{ inputs.nexkit_repository }}
      nexkit_ref: ${{ inputs.nexkit_ref }}
      action: ${{ needs.route.outputs.action }}
      decision: ${{ needs.route.outputs.decision }}
      config: ${{ needs.route.outputs.config }}
      timeout: ${{ needs.route.outputs.agent_timeout }}
      secret_names: ${{ needs.route.outputs.agent_secrets }}
      agent_ref: ${{ needs.route.outputs.agent_ref }}
    # Only the agent secrets this job's stages need, which route names in agent_secrets.
    # Read here, off the runner, so that the job's runner gets only these.
    secrets:
      AGENT_SECRET_1: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[0]] }}
      AGENT_SECRET_2: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[1]] }}
      AGENT_SECRET_3: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[2]] }}
      AGENT_SECRET_4: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[3]] }}
      AGENT_SECRET_5: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[4]] }}
      AGENT_SECRET_6: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[5]] }}
      AGENT_SECRET_7: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[6]] }}
      AGENT_SECRET_8: ${{ secrets[fromJSON(needs.route.outputs.agent_secrets)[7]] }}

  publish:
    needs: [route, agent]
    if: needs.agent.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      result: ${{ steps.publish.outputs.result }}
      head: ${{ steps.publish.outputs.head }}
      pr: ${{ steps.publish.outputs.pr }}
      conflicts: ${{ steps.publish.outputs.conflicts }}
    steps:
      # Push the branch, open the pull request, post the plan.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.app_id_secret] }}
          private-key: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.private_key_secret] }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-workflows: write # a merge of the base branch can bring workflow changes
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.route.outputs.base }}
          path: repo
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexkit-agent
          path: artifacts
      - id: publish
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit publish --repo repo --artifacts artifacts
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}

  # Count the shards of each sharded check on the head the checks run on: its `count` is
  # repository code, so it runs here, without secrets and with a read-only token, never in
  # route. Its outputs replace route's check matrix.
  shards:
    needs: [route, publish]
    if: >-
      always() && needs.route.result == 'success' && needs.route.outputs.count_shards == 'true' &&
      (needs.route.outputs.action == 'review' ||
       (contains(fromJSON('["implement","fix"]'), needs.route.outputs.action) &&
        needs.publish.outputs.head != '' && needs.publish.outputs.conflicts != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(needs.route.outputs.shards_timeout || '15') }}
    permissions:
      contents: read
    outputs:
      check_matrix: ${{ steps.shards.outputs.check_matrix }}
      skip_verify: ${{ steps.shards.outputs.skip_verify }}
      parallel_checks: ${{ steps.shards.outputs.parallel_checks }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.head || needs.route.outputs.head }}
          path: repo
          # All history, for NEXKIT_BASE_SHA and for the paths changed since a shard passed.
          fetch-depth: 0
          persist-credentials: false
      - id: shards
        name: Count the shards
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit shards --repo repo
        env:
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}

  verify:
    needs: [route, publish, shards]
    # Not for a head that conflicts with the base branch's tip: it cannot merge, and report
    # starts the conflict round at once. Not when route, or shards, skipped every check: no
    # path they read changed since they passed. Not when a configuration with sharded
    # checks got no count of them: no check runs on a guess.
    if: >-
      always() && needs.route.result == 'success' && needs.route.outputs.skip_verify != 'true' &&
      needs.shards.outputs.skip_verify != 'true' &&
      (needs.route.outputs.count_shards != 'true' || needs.shards.result == 'success') &&
      (needs.route.outputs.action == 'review' ||
       (contains(fromJSON('["implement","fix"]'), needs.route.outputs.action) &&
        needs.publish.outputs.head != '' && needs.publish.outputs.conflicts != 'true'))
    # One job that runs every check, or with parallel_checks one per check job (route, or
    # shards for sharded checks), without the jobs whose checks were skipped.
    name: ${{ matrix.group && format('verify ({0})', matrix.group) || 'verify' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.check_matrix || needs.route.outputs.check_matrix || '{"include":[{"group":"","timeout":10}]}') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.head || needs.route.outputs.head }}
          path: repo
          # All history, for the merge base in NEXKIT_BASE_SHA and for NEXKIT_VERIFIED_SHA.
          fetch-depth: 0
          persist-credentials: false
      # Restore only, before setup: this job runs code the agent wrote (see the action).
      - name: Restore caches
        if: fromJSON(needs.route.outputs.config).cache[0]
        continue-on-error: true # a missing or failed cache never fails the run
        uses: ./kit/.github/actions/restore-caches
        with:
          python: ${{ steps.python.outputs.python-path }}
          config: ${{ needs.route.outputs.config }}
          repo: repo
      - name: Run setup and checks
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit checks --repo repo --out out --group "$GROUP"
        env:
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          NEXKIT_SHARDS: ${{ needs.shards.outputs.shards }}
          GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          # nexkit-checks, or for one of several check jobs nexkit-checks-<group>, which
          # combine joins into nexkit-checks.
          name: ${{ matrix.group && format('nexkit-checks-{0}', matrix.group) || 'nexkit-checks' }}
          path: out/
          retention-days: 14

  combine:
    needs: [route, shards, verify]
    if: >-
      always() && needs.verify.result != 'skipped' &&
      (needs.shards.outputs.parallel_checks || needs.route.outputs.parallel_checks) == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # NexKit's own code; nothing of the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      # Each check job's artifact in a folder of its own name.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nexkit-checks-*
          path: parts
      - name: Combine check results
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit combine-checks --parts parts --out out
        env:
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          NEXKIT_SHARDS: ${{ needs.shards.outputs.shards }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nexkit-checks
          path: out/
          retention-days: 14

  review:
    needs: [route, publish, shards, verify, combine]
    # Also when route, or shards, skipped every check, so no verify job ran.
    if: >-
      always() &&
      (needs.verify.result == 'success' ||
       (needs.route.result == 'success' &&
        (needs.route.outputs.skip_verify == 'true' || needs.shards.outputs.skip_verify == 'true'))) &&
      contains(fromJSON('["success","skipped"]'), needs.combine.result)
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/pipeline-review.yml
    with:
      nexkit_repository: ${{ inputs.nexkit_repository }}
      nexkit_ref: ${{ inputs.nexkit_ref }}
      action: ${{ needs.route.outputs.action }}
      decision: ${{ needs.route.outputs.decision }}
      config: ${{ needs.route.outputs.config }}
      timeout: ${{ needs.route.outputs.review_timeout }}
      secret_names: ${{ needs.route.outputs.review_secrets }}
      head: ${{ needs.publish.outputs.head || needs.route.outputs.head }}
      pr: ${{ needs.publish.outputs.pr }}
      verify_result: ${{ needs.verify.result }}
      shards: ${{ needs.shards.outputs.shards }}
    # As for the agent job: read here, off the runner.
    secrets:
      AGENT_SECRET_1: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[0]] }}
      AGENT_SECRET_2: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[1]] }}
      AGENT_SECRET_3: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[2]] }}
      AGENT_SECRET_4: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[3]] }}
      AGENT_SECRET_5: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[4]] }}
      AGENT_SECRET_6: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[5]] }}
      AGENT_SECRET_7: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[6]] }}
      AGENT_SECRET_8: ${{ secrets[fromJSON(needs.route.outputs.review_secrets)[7]] }}

  report:
    needs: [route, agent, publish, shards, verify, combine, review]
    if: >-
      always() && needs.route.result == 'success' &&
      !contains(fromJSON('["none","maintain"]'), needs.route.outputs.action)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false # repository commands keep their own Python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.agent.result != 'skipped'
        continue-on-error: true # stage crashed before uploading; report reads files as absent
        with:
          name: nexkit-agent
          path: artifacts/nexkit-agent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verify.result != 'skipped'
        continue-on-error: true # stage crashed before uploading; report reads files as absent
        with:
          name: nexkit-checks
          path: artifacts/nexkit-checks
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.review.result != 'skipped'
        continue-on-error: true # stage crashed before uploading; report reads files as absent
        with:
          name: nexkit-review
          path: artifacts/nexkit-review
      # Statuses, review, comments, the next round, the merge.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.app_id_secret] }}
          private-key: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.private_key_secret] }}
          permission-actions: write # next automatic round and merge.after_workflows
          permission-checks: read # the required checks that failed or still run when GitHub refuses a merge
          permission-contents: write # merge with merge.auto; report never pushes or runs repository code
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-workflows: write # a merge may change workflow files
      - name: Report
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit report --artifacts artifacts
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          NEXKIT_SHARDS: ${{ needs.shards.outputs.shards }}
          NEXKIT_NEEDS: ${{ toJSON(needs) }}
          NEXKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  maintain:
    needs: route
    if: needs.route.outputs.action == 'maintain'
    runs-on: ubuntu-24.04
    # Longer for the run that waits for paused commands to come due: the longer of
    # usage_limit.wait_minutes and the longest wait of retry.wait_minutes.
    timeout-minutes: ${{ fromJSON(needs.route.outputs.maintain_timeout) }}
    permissions:
      contents: read
      issues: read # the wait for paused commands, before the App's token exists
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      # With the job's read-only token: this can last hours, and the App's token one.
      - name: Wait for paused commands
        if: fromJSON(needs.route.outputs.decision).task == 'resume'
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit maintain --wait
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
      # After the wait, so the token lasts for the work.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.app_id_secret] }}
          private-key: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.private_key_secret] }}
          permission-actions: write # resume paused commands, start conflict rounds and autopilot's commands
          permission-checks: read # failures of flaky runs; the failed required checks of a merge that waits
          permission-contents: write # merge a pull request whose required checks passed since, delete branches of closed work; no checkout
          permission-issues: write # close parent issues; mark paused runs as resumed; autopilot's issues
          permission-pull-requests: write # paused runs on pull requests; close a pull request a split supersedes
          permission-statuses: write # the pending statuses of a round that ended without a report
          permission-workflows: write # a merge may change workflow files
      # A token of its own, which may fail: an App without this permission gets no token at
      # all, and that must not stop the sweep, which says what is missing.
      - id: alerts
        if: fromJSON(needs.route.outputs.decision).task == 'sweep' && fromJSON(needs.route.outputs.config).autopilot.dependabot
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.app_id_secret] }}
          private-key: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.private_key_secret] }}
          permission-vulnerability-alerts: read # autopilot.dependabot
      - name: Maintain
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit maintain
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          NEXKIT_ALERTS_TOKEN: ${{ steps.alerts.outputs.token }}
          NEXKIT_DECISION: ${{ needs.route.outputs.decision }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          NEXKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

  finish:
    needs: [route, report]
    # Also when the run was cancelled: a run that ends without a report is noticed now,
    # not at the next sweep.
    if: >-
      always() && needs.route.result == 'success' &&
      contains(fromJSON('["plan","implement","fix","review"]'), needs.route.outputs.action) &&
      needs.report.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # NexKit's own code; nothing of the repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.nexkit_repository }}
          ref: ${{ inputs.nexkit_ref }}
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      # Start the sweep.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.app_id_secret] }}
          private-key: ${{ secrets[fromJSON(needs.route.outputs.config).github_app.private_key_secret] }}
          permission-actions: write # start the sweep
      - name: Finish
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit finish
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          NEXKIT_CONFIG: ${{ needs.route.outputs.config }}
          NEXKIT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
