name: NexKit reserve a project step
on:
  workflow_call:
    inputs:
      kit_repository:
        type: string
        required: true
      kit_ref:
        type: string
        required: true
      context_artifact_id:
        type: string
        required: true
      step:
        type: string
        required: true
      input_artifact_ids:
        type: string
        default: ''
    outputs:
      context_artifact_id:
        description: Exact reservation context for the project step
        value: ${{ jobs.prepare.outputs.context_artifact_id }}
      source:
        description: Immutable source the project job must use
        value: ${{ jobs.prepare.outputs.source }}
      kind:
        description: command or workflow
        value: ${{ jobs.prepare.outputs.kind }}
      timeout_minutes:
        description: Execution and collection deadline in minutes
        value: ${{ jobs.prepare.outputs.timeout_minutes }}
      execution_runner:
        description: Validated native command runner from the accepted configuration
        value: ${{ jobs.prepare.outputs.execution_runner }}
permissions: {}
env:
  NEXKIT_PROGRESS: '1'
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: read
    outputs:
      context_artifact_id: ${{ steps.context.outputs.artifact-id }}
      source: ${{ steps.prepare.outputs.source }}
      kind: ${{ steps.prepare.outputs.kind }}
      timeout_minutes: ${{ steps.prepare.outputs.timeout_minutes }}
      execution_runner: ${{ steps.prepare.outputs.execution_runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the kit pin before loading controller code
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REPOSITORY: ${{ inputs.kit_repository }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from urllib.parse import quote
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          repo = os.environ['GITHUB_REPOSITORY']
          branch = api('repos/' + repo)['default_branch']
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          data = api('repos/' + repo + '/contents/.nexkit/project.json?ref=' + quote(branch, safe=''))
          pin = json.loads(base64.b64decode(data['content']))['kit']
          assert re.fullmatch('[0-9a-f]{40}', pin['ref'])
          assert pin['ref'] == os.environ['NEXKIT_REF']
          assert pin['repository'] == os.environ['NEXKIT_REPOSITORY']
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.context_artifact_id }}
          path: /tmp/nexkit/input
      - if: inputs.input_artifact_ids != ''
        uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.input_artifact_ids }}
          path: /tmp/nexkit/reports
          multiple: 'true'
      - id: prepare
        name: Reserve the configured project step and its inputs
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
          NEXKIT_REF: ${{ inputs.kit_ref }}
          NEXKIT_STEP: ${{ inputs.step }}
        run: |
          shopt -s nullglob globstar
          reports=(/tmp/nexkit/reports/**/*.json)
          python3 -m nexkit.ci prepare-step --context /tmp/nexkit/input --step "$NEXKIT_STEP" --kit-ref "$NEXKIT_REF" --inputs "${reports[@]}" --out /tmp/nexkit/step.json
      - id: context
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexkit-step-${{ inputs.step }}-${{ github.run_attempt }}
          path: /tmp/nexkit/step.json
          retention-days: 7
          if-no-files-found: error
