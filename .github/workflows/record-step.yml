name: NexKit record a project step
on:
  workflow_call:
    inputs:
      kit_repository:
        type: string
        required: true
      kit_ref:
        type: string
        required: true
      context_artifact_id:
        type: string
        required: true
      result_artifact_id:
        description: Command report, or optional native job result JSON
        type: string
        default: ''
    outputs:
      status:
        description: Recorded done or blocked outcome
        value: ${{ jobs.record.outputs.status }}
      report_artifact_id:
        description: Recorded report for agent inputs or approval checkpoints
        value: ${{ jobs.record.outputs.report_artifact_id }}
permissions: {}
env:
  NEXKIT_PROGRESS: '1'
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read
      actions: read
    outputs:
      status: ${{ steps.record.outputs.status }}
      report_artifact_id: ${{ steps.report.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the kit pin before loading controller code
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REPOSITORY: ${{ inputs.kit_repository }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from urllib.parse import quote
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          repo = os.environ['GITHUB_REPOSITORY']
          branch = api('repos/' + repo)['default_branch']
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          data = api('repos/' + repo + '/contents/.nexkit/project.json?ref=' + quote(branch, safe=''))
          pin = json.loads(base64.b64decode(data['content']))['kit']
          assert re.fullmatch('[0-9a-f]{40}', pin['ref'])
          assert pin['ref'] == os.environ['NEXKIT_REF']
          assert pin['repository'] == os.environ['NEXKIT_REPOSITORY']
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.context_artifact_id }}
          path: /tmp/nexkit/context
      - if: inputs.result_artifact_id != ''
        uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.result_artifact_id }}
          path: /tmp/nexkit/result
      - id: record
        name: Verify the reservation and persist its actual result
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
          NEXKIT_REF: ${{ inputs.kit_ref }}
        run: |
          shopt -s nullglob
          reports=(/tmp/nexkit/result/*.json)
          args=()
          if [ "${#reports[@]}" = 1 ]; then args+=(--result "${reports[0]}"); fi
          python3 -m nexkit.ci record-step --context /tmp/nexkit/context --kit-ref "$NEXKIT_REF" "${args[@]}" --out /tmp/nexkit/report.json
      - id: report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexkit-step-report-${{ inputs.context_artifact_id }}-${{ github.run_attempt }}
          path: /tmp/nexkit/report.json
          retention-days: 7
          if-no-files-found: error
