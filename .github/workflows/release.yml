# The engine's image (docs/engine.md#the-parts). Every pull request and push to main builds it
# and checks that it serves the answers of standard input. When a release is published, the
# image of the release's commit is published as ghcr.io/phuongnse/nexkit-engine:<version>.
# The job that builds and runs the image holds a read-only token; the job that publishes it
# runs no repository code, only loads the built image and pushes it.
name: Release

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions: {}

env:
  IMAGE: ghcr.io/phuongnse/nexkit-engine

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A release reads main's history, to check that its commit is on main.
          fetch-depth: ${{ github.event_name == 'release' && 0 || 1 }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: version
        name: Read the version; a release must be it, on a commit of main
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import nexkit; print(nexkit.__version__)')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != release ]; then
            exit 0
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release $TAG is not v$version, the version in nexkit/__init__.py."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The release's commit $GITHUB_SHA is not on main."
            exit 1
          fi
      - name: Build the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          base=$(python -c 'import nexkit; print(nexkit.PYTHON_IMAGE)')
          docker build --build-arg PYTHON_IMAGE="$base" \
            --label org.opencontainers.image.version="$VERSION" --tag "$IMAGE:$VERSION" .
      - name: Check that the image serves the answers of standard input
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          request=nexkit/protocol/v1/examples/calls/step.json
          docker run --detach --name engine --publish 127.0.0.1:8080:8080 "$IMAGE:$VERSION"
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 \
            --data-binary "@$request" http://127.0.0.1:8080/step > served.json
          docker stop engine
          python bin/nexkit-engine step < "$request" > expected.json
          cmp served.json expected.json
      - name: Save the image
        if: github.event_name == 'release'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker image save "$IMAGE:$VERSION" | gzip > "$RUNNER_TEMP/nexkit-engine.tar.gz"
      - if: github.event_name == 'release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexkit-engine-image
          path: ${{ runner.temp }}/nexkit-engine.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    # The one job that writes with github.token: GHCR takes no GitHub App token (AGENTS.md).
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexkit-engine-image
          path: ${{ runner.temp }}
      - name: Push the image
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker image load --input "$RUNNER_TEMP/nexkit-engine.tar.gz"
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker logout ghcr.io
