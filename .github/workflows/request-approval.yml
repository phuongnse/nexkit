name: NexKit request a stage approval
on:
  workflow_call:
    inputs:
      kit_repository:
        type: string
        required: true
      kit_ref:
        type: string
        required: true
      context_artifact_id:
        type: string
        required: true
      gate:
        type: string
        required: true
      input_artifact_ids:
        type: string
        default: ''
      check_artifact_ids:
        type: string
        default: ''
      review_artifact_id:
        type: string
        default: ''
    outputs:
      ready:
        description: True only when this optional approval is disabled
        value: ${{ jobs.request.outputs.ready }}
      status:
        description: Disabled or waiting_for_approval
        value: ${{ jobs.request.outputs.status }}
      context_artifact_id:
        description: Forwarded context for a disabled gate
        value: ${{ jobs.request.outputs.context_artifact_id }}
permissions: {}
jobs:
  request:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read
      checks: write
    outputs:
      ready: ${{ steps.request.outputs.ready }}
      status: ${{ steps.request.outputs.status }}
      context_artifact_id: ${{ steps.context.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the kit pin before loading controller code
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REPOSITORY: ${{ inputs.kit_repository }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from urllib.parse import quote
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          repo = os.environ['GITHUB_REPOSITORY']
          branch = api('repos/' + repo)['default_branch']
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          data = api('repos/' + repo + '/contents/.nexkit/project.json?ref=' + quote(branch, safe=''))
          pin = json.loads(base64.b64decode(data['content']))['kit']
          assert re.fullmatch('[0-9a-f]{40}', pin['ref'])
          assert pin['ref'] == os.environ['NEXKIT_REF']
          assert pin['repository'] == os.environ['NEXKIT_REPOSITORY']
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.context_artifact_id }}
          path: /tmp/nexkit/input
      - if: inputs.input_artifact_ids != ''
        uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.input_artifact_ids }}
          path: /tmp/nexkit/inputs
          multiple: 'true'
      - if: inputs.check_artifact_ids != ''
        uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.check_artifact_ids }}
          path: /tmp/nexkit/checks
          multiple: 'true'
      - if: inputs.review_artifact_id != ''
        uses: ./kit/actions/download-data
        with:
          artifact-ids: ${{ inputs.review_artifact_id }}
          path: /tmp/nexkit/review
      - id: request
        name: Freeze exact results and end execution while awaiting a human decision
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
          NEXKIT_REF: ${{ inputs.kit_ref }}
          NEXKIT_GATE: ${{ inputs.gate }}
        run: |
          shopt -s nullglob globstar
          prior=(/tmp/nexkit/inputs/**/*.json)
          checks=(/tmp/nexkit/checks/**/*.json)
          reviews=(/tmp/nexkit/review/*.json)
          args=()
          if [ "${#reviews[@]}" = 1 ]; then args+=(--review "${reviews[0]}"); fi
          python3 -m nexkit.ci request-approval --context /tmp/nexkit/input --gate "$NEXKIT_GATE" --kit-ref "$NEXKIT_REF" --inputs "${prior[@]}" --reports "${checks[@]}" "${args[@]}" --out /tmp/nexkit/context.json
      - id: context
        if: steps.request.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexkit-disabled-approval-${{ inputs.gate }}-${{ github.run_attempt }}
          path: /tmp/nexkit/context.json
          retention-days: 7
          if-no-files-found: error
