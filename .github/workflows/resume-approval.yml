name: NexKit continue after a stage approval
on:
  workflow_call:
    inputs:
      kit_repository:
        type: string
        required: true
      kit_ref:
        type: string
        required: true
      pipeline:
        type: string
        required: true
      gate:
        type: string
        required: true
    outputs:
      ready:
        description: An approval for this exact result authorized continuation
        value: ${{ jobs.resume.outputs.ready }}
      status:
        description: Approved, waiting, retry, blocked or idle
        value: ${{ jobs.resume.outputs.status }}
      context_artifact_id:
        description: Fresh artifact containing the recorded checkpoint context
        value: ${{ jobs.resume.outputs.context_artifact_id }}
permissions: {}
jobs:
  resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: read
      actions: write
    outputs:
      ready: ${{ steps.resume.outputs.ready }}
      status: ${{ steps.resume.outputs.status }}
      context_artifact_id: ${{ steps.context.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the kit pin before loading controller code
        env:
          GH_TOKEN: ${{ github.token }}
          NEXKIT_REPOSITORY: ${{ inputs.kit_repository }}
          NEXKIT_REF: ${{ inputs.kit_ref }}
        run: |
          python3 - <<'PY'
          import base64, json, os, re, subprocess
          from urllib.parse import quote
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          repo = os.environ['GITHUB_REPOSITORY']
          branch = api('repos/' + repo)['default_branch']
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          data = api('repos/' + repo + '/contents/.nexkit/project.json?ref=' + quote(branch, safe=''))
          pin = json.loads(base64.b64decode(data['content']))['kit']
          assert re.fullmatch('[0-9a-f]{40}', pin['ref'])
          assert pin['ref'] == os.environ['NEXKIT_REF']
          assert pin['repository'] == os.environ['NEXKIT_REPOSITORY']
          PY
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ inputs.kit_repository }}
          ref: ${{ inputs.kit_ref }}
          path: kit
          persist-credentials: false
      - id: resume
        name: Recheck approval and resume the remaining work
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/kit
          NEXKIT_REF: ${{ inputs.kit_ref }}
          NEXKIT_PIPELINE: ${{ inputs.pipeline }}
          NEXKIT_GATE: ${{ inputs.gate }}
        run: python3 -m nexkit.ci resume-approval --gate "$NEXKIT_GATE" --kit-ref "$NEXKIT_REF" --out /tmp/nexkit/context.json
      - id: context
        if: steps.resume.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nexkit-resumed-${{ inputs.gate }}-${{ github.run_attempt }}
          path: /tmp/nexkit/context.json
          retention-days: 7
          if-no-files-found: error
