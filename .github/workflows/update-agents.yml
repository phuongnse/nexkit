# Every week, propose the newest stable version of each agent runtime, one pull request per
# runtime. CI on the pull request runs the unit tests and that runtime's live smoke test
# with that exact version; merge it when CI is green, then release. Until then the pipeline
# keeps using the version it was tested with. A run that fails says so in an issue, which
# the next run that succeeds closes.
name: Update agents

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write # the issue that says this workflow failed

concurrency:
  group: update-agents

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Open a pull request per runtime
        shell: bash # with pipefail, so the step fails with the script
        run: |
          # The log goes to a file too, for the issue that says this workflow failed.
          {
            base=$(git rev-parse HEAD)
            for runtime in $(python -c "from nexkit.runtimes import RUNTIMES; print(*RUNTIMES)"); do
              git checkout -q --detach "$base"
              version=$(python scripts/agent_version.py "$runtime" update)
              if [ -z "$version" ]; then
                echo "$runtime is up to date."
                continue
              fi
              branch="update/$runtime-$version"
              if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
                echo "A pull request for $runtime $version is already open."
                git checkout -q -- nexkit/__init__.py
                continue
              fi
              git switch -q -c "$branch"
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -qam "Support $runtime $version"
              git push --force origin "$branch"
              gh pr create --head "$branch" --title "Support $runtime $version" --body \
                "$runtime $version is the newest stable version. CI on this branch runs the unit tests and the live smoke test with it. Merge when CI is green, then release."
              # Pull requests opened with the Actions token do not start CI; dispatch it.
              gh workflow run ci.yml --ref "$branch" -f runtime="$runtime"
            done
          } 2>&1 | tee "$RUNNER_TEMP/update.log"
        env:
          GH_TOKEN: ${{ github.token }}
      # A run that fails leaves no pull request, which looks the same as no newer version:
      # say so in an issue, one at a time, and close it once a run succeeds.
      - name: Report the failure in an issue
        if: failure()
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "[Update agents]($url) failed, so no pull request proposes a newer agent runtime. The end of its log:"
            echo
            echo '```'
            tail -n 20 "$RUNNER_TEMP/update.log" 2>/dev/null || echo "(no log)"
            echo '```'
            echo
            echo "This issue closes when the workflow next succeeds."
          } > "$RUNNER_TEMP/failed.md"
          number=$(gh issue list --state open --author app/github-actions --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/failed.md"
          else
            gh issue create --title "$TITLE" --label bug --body-file "$RUNNER_TEMP/failed.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Update agents failed
      - name: Close the failure issue
        if: success()
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for number in $(gh issue list --state open --author app/github-actions --search "\"$TITLE\" in:title" --json number -q '.[].number'); do
            gh issue close "$number" --comment "[Update agents]($url) succeeded."
          done
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Update agents failed
