# Every week, propose the current digest of the engine image's base, PYTHON_IMAGE in
# nexkit/__init__.py, which moves when its tag gets security fixes. One pull request, from the
# branch update/python-image, changes only that pin, and none opens while the pin is the
# tag's digest. Pull requests opened with the Actions token start no workflows, so this one
# starts CI and release.yml on the branch: the image's build from the new digest and its
# check against standard input run as the pull request's checks. Merge it when they are
# green. A run that fails says so in an issue, which the next run that succeeds closes.
name: Update the engine's base image

on:
  schedule:
    - cron: "43 3 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-image

env:
  BRANCH: update/python-image

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # push the branch
      pull-requests: write # open its pull request
      actions: write # start CI and the image's check on it
      issues: write # the issue that says this workflow failed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Open a pull request when the tag's digest moved
        run: |
          image=$(python scripts/image_digest.py update)
          if [ -z "$image" ]; then
            echo "PYTHON_IMAGE is the current digest of its tag."
            exit 0
          fi
          open=$(gh pr list --head "$BRANCH" --state open --json number -q '.[0].number')
          if [ -n "$open" ] && git fetch -q origin "$BRANCH" &&
             git show FETCH_HEAD:nexkit/__init__.py | grep -qF "\"$image\""; then
            echo "Pull request #$open already proposes $image."
            exit 0
          fi
          git switch -q -c "$BRANCH"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qam "Build the engine's image on $image"
          git push --force origin "$BRANCH"
          if [ -z "$open" ]; then
            gh pr create --head "$BRANCH" --label dependencies \
              --title "Build the engine's image on the current digest of ${image%@*}" --body \
              "${image%@*} now names $image. This changes only \`PYTHON_IMAGE\`. CI and the image's build and check (release.yml) run on this branch. Merge when they are green."
          fi
          # Pull requests opened or pushed with the Actions token start no workflows.
          gh workflow run ci.yml --ref "$BRANCH" -f runtime=none
          gh workflow run release.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
      # A run that fails leaves no pull request, which looks the same as no new digest: say
      # so in an issue, one at a time, and close it once a run succeeds.
      - name: Report the failure in an issue
        if: failure()
        run: |
          body="[Update the engine's base image]($RUN_URL) failed, so no pull request proposes a new digest of the engine image's base. This issue closes when the workflow next succeeds."
          number=$(gh issue list --state open --author app/github-actions --search "\"$TITLE\" in:title" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "[Update the engine's base image]($RUN_URL) failed again."
          else
            gh issue create --title "$TITLE" --label bug --body "$body"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Update the engine's base image failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Close the failure issue
        if: success()
        run: |
          for number in $(gh issue list --state open --author app/github-actions --search "\"$TITLE\" in:title" --json number -q '.[].number'); do
            gh issue close "$number" --comment "[Update the engine's base image]($RUN_URL) succeeded."
          done
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Update the engine's base image failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
