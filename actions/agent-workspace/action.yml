name: NexKit isolated workspace
description: Prepare a fresh unprivileged coding-agent workspace from trusted input.
inputs:
  role:
    required: true
    description: request, deliver, review or task
  context:
    required: true
    description: Controller context JSON path
  source:
    required: true
    description: Trusted source checkout path
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NEXKIT_ROLE: ${{ inputs.role }}
        NEXKIT_CONTEXT: ${{ inputs.context }}
        NEXKIT_SOURCE: ${{ inputs.source }}
        NEXKIT_EXEC_USER: nexkit-agent
        PYTHONPATH: ${{ github.workspace }}/kit
      run: |
        sudo useradd --create-home --shell /bin/bash nexkit-agent
        sudo chown "$(id -u):$(id -g)" /home/nexkit-agent
        sudo chmod 755 /home/nexkit-agent
        python3 -m nexkit.ci materialize --role "$NEXKIT_ROLE" --context "$NEXKIT_CONTEXT" --source "$NEXKIT_SOURCE" --workspace /home/nexkit-agent/work --data-dir /tmp/nexkit
        # Preserve trusted Git metadata before consumer installation scripts run.
        sudo env PYTHONPATH="$GITHUB_WORKSPACE/kit" python3 -m nexkit.workspace snapshot
        sudo chown -R nexkit-agent:nexkit-agent /home/nexkit-agent/work
        # Temporarily allow installation into the dedicated user's actual HOME.
        sudo chown nexkit-agent:nexkit-agent /home/nexkit-agent
        if [ "$NEXKIT_ROLE" != request ]; then
          python3 -m nexkit.ci environment --context "$NEXKIT_CONTEXT" --workspace /home/nexkit-agent/work
        fi
        # Setup commands are untrusted: rebuild host controls after they exit.
        sudo env PYTHONPATH="$GITHUB_WORKSPACE/kit" python3 -m nexkit.workspace restore --role "$NEXKIT_ROLE" --owner "$(id -u)"
        sudo chmod -R a+rX /tmp/nexkit /home/nexkit-agent/.codex
        # Control sources and action implementations cannot be changed by the agent.
        chmod -R go-w "$GITHUB_WORKSPACE/kit"
