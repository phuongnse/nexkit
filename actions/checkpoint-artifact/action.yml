name: NexKit durable checkpoint transport
description: Start a bounded trusted checkpoint monitor with artifact-only credentials.
inputs:
  context:
    description: Exact authorized session context
    required: true
  role:
    description: Authorized agent role
    required: true
  source:
    description: Trusted source checkout
    required: true
  sdk:
    description: Trusted npm installation of the pinned artifact SDK
    required: true
runs:
  using: node20
  main: start.cjs
