name: NexKit subscription CLI
description: Run official Codex with this consumer runner's isolated ChatGPT login.
inputs:
  role:
    required: true
    description: request, deliver, review or task
  context:
    required: true
    description: Trusted controller context JSON path
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NEXKIT_ROLE: ${{ inputs.role }}
        NEXKIT_CONTEXT: ${{ inputs.context }}
      run: |
        sudo -n env PYTHONPATH="$GITHUB_WORKSPACE/kit" python3 -m nexkit.subscription --context "$NEXKIT_CONTEXT" --role "$NEXKIT_ROLE"
