        path: ${{ steps.plan.outputs.paths2 }}
        key: ${{ steps.plan.outputs.prefix2 }}${{ hashFiles(steps.plan.outputs.files2) }}
        restore-keys: ${{ steps.plan.outputs.prefix2 }}
    - id: cache2
      if: steps.plan.outputs.name2 && steps.plan.outputs.save != 'true'
      continue-on-error: true # a failed cache never fails the run
