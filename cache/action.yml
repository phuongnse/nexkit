# Restore and save the caches in `cache` of .nexkit/config.json, for a workflow of the
# repository: `uses: phuongnse/nexkit/cache@<ref>`, after the checkout and before setup. Each
# entry gets the key that NexKit's runs restore (.github/actions/restore-caches), so a
# repository states its caches once. NexKit's own jobs never use this action: they run code
# the agent wrote, and only restore.
#
# It saves, at the end of a successful job, only on the base branch; caches saved elsewhere
# are not visible to NexKit. Other refs only restore. A workflow cannot loop over steps, so
# there are two steps per possible entry: MAX_CACHES in nexkit/config.py.
name: NexKit caches
description: Restore the caches in .nexkit/config.json, and save them on the base branch
inputs:
  repo:
    description: The repository checkout, relative to the workspace
    default: "."
  base:
    description: The branch that saves the caches
    default: ${{ github.event.repository.default_branch }}
runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
        update-environment: false # repository commands keep their own Python
    - id: plan
      shell: bash
      run: '"$NEXKIT_PYTHON" "$GITHUB_ACTION_PATH/../bin/nexkit" cache --save --repo "$NEXKIT_REPO" --base "$NEXKIT_BASE"'
      env:
        NEXKIT_PYTHON: ${{ steps.python.outputs.python-path }}
        NEXKIT_REPO: ${{ inputs.repo }}
        NEXKIT_BASE: ${{ inputs.base }}
    - id: save1
      if: steps.plan.outputs.name1 && steps.plan.outputs.save == 'true'
      continue-on-error: true # a failed cache never fails the run
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths1 }}
        key: ${{ steps.plan.outputs.prefix1 }}${{ hashFiles(steps.plan.outputs.files1) }}
        restore-keys: ${{ steps.plan.outputs.prefix1 }}
    - id: cache1
      if: steps.plan.outputs.name1 && steps.plan.outputs.save != 'true'
      continue-on-error: true # a failed cache never fails the run
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.plan.outputs.paths1 }}
        key: ${{ steps.plan.outputs.prefix1 }}${{ hashFiles(steps.plan.outputs.files1) }}
        restore-keys: ${{ steps.plan.outputs.prefix1 }}
    - id: save2
      if: steps.plan.outputs.name2 && steps.plan.outputs.save == 'true'
      continue-on-error: true # a failed cache never fails the run
