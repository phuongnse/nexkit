# Connection example. Replace the zero kit pin, identifiers and project commands.
# Configure intake separately; this entrypoint runs an already approved issue.
name: Inspect the project
on:
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue:
        type: string
        required: true
      pipeline:
        type: string
        required: true
        default: inspection
permissions:
  contents: write
  issues: write
  pull-requests: read
  checks: write
  actions: write
concurrency:
  group: nexkit-work
  queue: max
jobs:
  prepare:
    uses: phuongnse/nexkit/.github/workflows/prepare-work.yml@0000000000000000000000000000000000000000
    with:
      kit_repository: phuongnse/nexkit
      kit_ref: '0000000000000000000000000000000000000000'
      pipeline: inspection
      work_type: tasks
  inspect:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    uses: phuongnse/nexkit/.github/workflows/agent-invocation.yml@0000000000000000000000000000000000000000
    with:
      kit_repository: phuongnse/nexkit
      kit_ref: '0000000000000000000000000000000000000000'
      context_artifact_id: ${{ needs.prepare.outputs.context_artifact_id }}
      invocation: inspect
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  project-rules:
    needs: [prepare, inspect]
    if: needs.inspect.outputs.status == 'done'
    uses: phuongnse/nexkit/.github/workflows/project-step.yml@0000000000000000000000000000000000000000
    with:
      kit_repository: phuongnse/nexkit
      kit_ref: '0000000000000000000000000000000000000000'
      context_artifact_id: ${{ needs.prepare.outputs.context_artifact_id }}
      step: project-rules
      input_artifact_ids: ${{ needs.inspect.outputs.report_artifact_id }}
  approve-report:
    needs: [prepare, inspect, project-rules]
    if: needs.inspect.outputs.status == 'done' && needs.project-rules.outputs.status == 'done'
    uses: phuongnse/nexkit/.github/workflows/request-approval.yml@0000000000000000000000000000000000000000
    with:
      kit_repository: phuongnse/nexkit
      kit_ref: '0000000000000000000000000000000000000000'
      context_artifact_id: ${{ needs.prepare.outputs.context_artifact_id }}
      gate: report-review
      input_artifact_ids: ${{ needs.inspect.outputs.report_artifact_id }},${{ needs.project-rules.outputs.report_artifact_id }}
  finish:
    needs: [prepare, inspect, project-rules, approve-report]
    if: always() && needs.prepare.outputs.ready == 'true'
    uses: phuongnse/nexkit/.github/workflows/finish-tasks.yml@0000000000000000000000000000000000000000
    with:
      kit_repository: phuongnse/nexkit
      kit_ref: '0000000000000000000000000000000000000000'
      context_artifact_id: ${{ needs.prepare.outputs.context_artifact_id }}
      jobs_succeeded: ${{ needs.inspect.result == 'success' && needs.inspect.outputs.status == 'done' && needs.project-rules.result == 'success' && needs.project-rules.outputs.status == 'done' && needs.approve-report.result == 'success' && needs.approve-report.outputs.ready == 'true' }}
