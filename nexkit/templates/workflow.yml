# Installed by `nexkit init`. Commands: /nexkit plan, /nexkit go (issues);
# /nexkit fix, /nexkit review (NexKit pull requests). Settings: .nexkit/config.json
name: NexKit

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      command:
        description: plan, go, fix or review
        required: true
        type: string
      number:
        description: Issue or pull request number
        required: true
        type: string
      note:
        description: Extra instructions for the agent
        required: false
        type: string
      auto:
        description: Set by NexKit for automatic fix rounds
        required: false
        type: string
        default: "false"

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  nexkit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/nexkit')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       startsWith(github.event.pull_request.head.ref, 'nexkit/'))
    # One run at a time per issue or pull request. Set on the job, so only commands join.
    concurrency:
      group: nexkit-${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
    uses: __KIT_REPO__/.github/workflows/pipeline.yml@__KIT_REF__
    with:
      nexkit_repository: __KIT_REPO__
      nexkit_ref: __KIT_REF__
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NEXKIT_PUSH_TOKEN: ${{ secrets.NEXKIT_PUSH_TOKEN }}
