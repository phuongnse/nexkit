# Installed by `nexkit init`. Commands: /nexkit plan, /nexkit go, /nexkit trust (issues);
# /nexkit fix (NexKit pull requests); /nexkit review (any pull request of this repository's
# branches). On a NexKit pull request, a writer's *Request changes* review starts a fix
# round, and an approval merges one whose merge GitHub refused (merge.auto). The commands on
# an issue and the rounds on its NexKit pull request wait in one queue. Settings:
# .nexkit/config.json
name: NexKit

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed, opened, reopened, milestoned, labeled, unlabeled] # close_parent_issues, autopilot
  milestone:
    types: [closed] # autopilot: the next milestone comes into scope
  push:
    branches: [__DEFAULT_BRANCH__] # conflicts.auto_resolve: the default branch moved
  schedule:
    - cron: "23 * * * *" # usage_limit.resume, retry.wait_minutes, conflicts.auto_resolve, autopilot
  # autopilot with merge.after_workflows or autopilot.watch_workflows: a finished run of
  # those workflows on the default branch starts a sweep at once, also a run that NexKit
  # started. Name each workflow as its `name:` does.
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [__DEFAULT_BRANCH__]
  workflow_dispatch:
    inputs:
      command:
        description: plan, go, fix, review, step for one issue's autopilot step, or autopilot for a sweep
        required: true
        type: string
      number:
        description: Issue or pull request number (autopilot for a sweep)
        required: true
        type: string
      note:
        description: Extra instructions for the agent
        required: false
        type: string
      auto:
        description: Set by NexKit for automatic, conflict, resumed, retried and autopilot runs
        required: false
        type: string
        default: "false"

# Read only: NexKit writes as the repository's GitHub App (github_app in the config).
permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  # Names the work item of the event, for the group below. Read only, with no App key and no
  # checkout of this repository: it runs NexKit's code and reads numbers and branch names.
  item:
    if: >-
      contains(fromJSON('["workflow_dispatch","issues","milestone","push","schedule","workflow_run"]'), github.event_name) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/nexkit')) ||
      (github.event_name == 'pull_request_review' &&
       contains(fromJSON('["changes_requested","approved"]'), github.event.review.state) &&
       startsWith(github.event.pull_request.head.ref, 'nexkit/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      item: ${{ steps.item.outputs.item }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: __KIT_REPO__
          ref: __KIT_REF__
          path: kit
          persist-credentials: false
      - id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          update-environment: false
      - id: item
        run: ${{ steps.python.outputs.python-path }} kit/bin/nexkit item
        env:
          GITHUB_TOKEN: ${{ github.token }}

  nexkit:
    needs: item
    # One run at a time per work item: an issue and its NexKit pull request, or a person's
    # pull request. Set on the job, so only commands join. The `item` job names the item;
    # a sweep, the run that waits for paused commands, an approval and each other event
    # keep a group of their own, so they never replace a command that waits.
    concurrency:
      group: nexkit-${{ (github.event_name == 'milestone' || (github.event_name == 'issues' && github.event.action != 'closed')) && 'autopilot' || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved') && format('approved-{0}', github.event.pull_request.number) || needs.item.outputs.item || github.event_name }}
    uses: __KIT_REPO__/.github/workflows/pipeline.yml@__KIT_REF__
    with:
      nexkit_repository: __KIT_REPO__
      nexkit_ref: __KIT_REF__
    # The pipeline passes each job only the secrets .nexkit/config.json names for it (its
    # stages' agents, or the App's), so it can read them by those names.
    secrets: inherit
