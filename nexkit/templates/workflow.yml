# Installed by `nexkit init`. Commands: /nexkit plan, /nexkit go (issues);
# /nexkit fix, /nexkit review (NexKit pull requests). Settings: .nexkit/config.json
name: NexKit

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [closed, opened, reopened, milestoned] # close_parent_issues, autopilot
  milestone:
    types: [closed] # autopilot: the next milestone comes into scope
  push:
    branches: [__DEFAULT_BRANCH__] # conflicts.auto_resolve: the default branch moved
  schedule:
    - cron: "23 * * * *" # usage_limit.resume, conflicts.auto_resolve, autopilot
  # autopilot with merge.after_workflows: a finished run of those workflows on the default
  # branch starts a sweep at once. Name each workflow as its `name:` does.
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [__DEFAULT_BRANCH__]
  workflow_dispatch:
    inputs:
      command:
        description: plan, go, fix, review, or autopilot for a sweep
        required: true
        type: string
      number:
        description: Issue or pull request number (autopilot for a sweep)
        required: true
        type: string
      note:
        description: Extra instructions for the agent
        required: false
        type: string
      auto:
        description: Set by NexKit for automatic, conflict, resumed and autopilot runs
        required: false
        type: string
        default: "false"

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  actions: write
  checks: read

jobs:
  nexkit:
    if: >-
      contains(fromJSON('["workflow_dispatch","issues","milestone","push","schedule","workflow_run"]'), github.event_name) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/nexkit')) ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.state == 'changes_requested' &&
       startsWith(github.event.pull_request.head.ref, 'nexkit/'))
    # One run at a time per issue or pull request. Set on the job, so only commands join.
    # Runs for other events, such as the schedule, form a group per event. Autopilot's
    # events and sweeps share one group, so they never replace a command that waits.
    concurrency:
      group: nexkit-${{ (github.event_name == 'milestone' || (github.event_name == 'issues' && github.event.action != 'closed')) && 'autopilot' || github.event.issue.number || github.event.pull_request.number || inputs.number || github.event_name }}
    uses: __KIT_REPO__/.github/workflows/pipeline.yml@__KIT_REF__
    with:
      nexkit_repository: __KIT_REPO__
      nexkit_ref: __KIT_REF__
    # The pipeline passes each job only the secrets .nexkit/config.json names for it (its
    # stages' agents, or the push token), so it can read them by those names.
    secrets: inherit
