[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexkit"
version = "1.0.0"
description = "Turn GitHub issues into reviewed, tested pull requests with Claude Code."
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
nexkit = "nexkit.cli:main"

[tool.setuptools.packages.find]
include = ["nexkit*"]

[tool.setuptools.package-data]
nexkit = ["prompts/*.md", "templates/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
