[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nexkit"
version = "6.13.1"
description = "Turn GitHub issues into reviewed, tested pull requests with coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
nexkit = "nexkit.cli:main"
nexkit-engine = "nexkit.engine.cli:main"

[tool.setuptools.packages.find]
include = ["nexkit*"]

[tool.setuptools.package-data]
nexkit = [
    "engine/prompts/*.md",
    "templates/*",
    "protocol/v1/*.schema.json",
    "protocol/v1/*/*.schema.json",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
